# pod1 will be scheduled on any node, but pod2 will be schediled on the same zone as pod1. but pod 3 will be schedle on a different node than pod1.
apiVersion: v1
kind: Pod
metadata:
  name: pod-1
  labels:
    name: pod-1 
    purpose: affinity
spec:
  containers:
    - name: nginx
      image: nginx
      imagePullPolicy: always #keep this as always
